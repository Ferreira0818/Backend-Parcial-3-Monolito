server:
  port: 8761 # Puerto estándar y por convención para Eureka Server
spring:
  application:
    name: eureka-server # Nombre con el que se identifica esta aplicación
eureka:
  instance:
    hostname: localhost
  client:
    # Como este servicio ES el servidor, no debe intentar registrarse a sí mismo
    register-with-eureka: false
    # Tampoco debe intentar consultar el registro de otro servidor
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/