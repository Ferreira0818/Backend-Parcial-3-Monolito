server:
  port: ${PORT:8080} # Render asigna dinámicamente el puerto en la variable $PORT

spring:
  datasource:
    # Render inyectará la URL completa de Neon aquí
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Le indicamos a Flyway que en producción use los scripts de PostgreSQL
    locations: classpath:db/migration/postgres