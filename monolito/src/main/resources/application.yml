server:
  port: 8080 # Puerto público local directo (sin Gateway)
  forward-headers-strategy: framework # Respeta headers de proxy inverso (ej. HTTPS en Render / HATEOAS)

spring:
  application:
    name: monolito

  datasource:
    # Ajusta el nombre de la BD y tus credenciales locales de MySQL
    url: jdbc:mysql://localhost:3306/poe_shop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "" # <-- CAMBIA ESTO por tu contraseña local de MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Cuando usamos Flyway, Hibernate NO debe crear ni alterar tablas, solo VALIDAR el esquema
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs