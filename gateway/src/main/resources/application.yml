server:
  port: 8080 # Puerto público principal para que React consuma la API

spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          # Ruta 1: Todo el tráfico de negocio hacia el monolito
          - id: monolito-api
            uri: lb://monolito
            predicates:
              - Path=/api/**
          
          # Ruta 2: Documentación OpenAPI del monolito
          - id: monolito-docs
            uri: lb://monolito
            predicates:
              - Path=/v3/api-docs/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Configuración de Swagger UI unificado en el Gateway
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Monolito (PoE Shop API)
        url: /v3/api-docs